name: example-coding
factory_dir: .factory
variables:
  worktree: ${execution.factory_dir}/worktrees/${execution.id}
  project_subdir: .
  workspace: ${variables.worktree}/${variables.project_subdir}
packages:
  - name: builder
    path: ./agents/builder
    entrypoint: start.sh
    args:
      - --workspace
      - ${variables.workspace}
      - '{prompt}'
    runtime:
      name: pi
      version: ">=1.0.0 <2.0.0"
    overrides:
      provider: corporate
      model: coding-model
      base_url: https://ai.example.com/v1
      api: openai-completions
      api_key_env: CORPORATE_AI_KEY
      thinking: medium
      model_config:
        reasoning: true
        context_window: 128000
        max_tokens: 8192
        input:
          - text
  - name: reviewer
    path: ./agents/reviewer
    entrypoint: start.sh
    args:
      - --workspace
      - ${variables.workspace}
      - '{prompt}'
    runtime:
      name: pi
      version: ">=1.0.0 <2.0.0"
    overrides:
      api_key_env: REVIEW_AI_KEY
workflow:
  start: build
  stages:
    - name: implementation
      loop:
        mode: sequential
        limit: 3
        steps:
          - name: build
            type: run
            title: Implement the request
            instructions: Implement the request in the project and report the changes and checks performed.
            on:
              ready_for_review: review
              failed: $blocked
            budget:
              tokens: 2000000
              elapsed_seconds: 1800
              idle_seconds: 600
              warn_percent: 80
              action: pause
            package: builder
            input_bindings:
              task:
                execution: input
          - name: review
            type: run
            title: Review the implementation
            instructions: Review the work against the request. Return changes_requested with specific findings or completed when it is ready for human acceptance.
            on:
              changes_requested: build
              completed: acceptance
              failed: $blocked
            package: reviewer
      human:
        required: true
        step: acceptance
      hooks:
        after:
          - name: commit-implementation
            command: python3
            arguments:
              - ../registry/scripts/git-commit.py
              - --workspace
              - ${variables.workspace}
              - --type
              - chore
              - --scope
              - implementation
              - --description
              - complete implementation stage
              - --path
              - .
  steps:
    - name: acceptance
      type: decision
      actor: human
      title: Accept the implementation
      on:
        approve: $done
        request_changes: build
        reject: $blocked
hooks:
  before:
    - name: prepare-worktree
      command: python3
      arguments:
        - ../registry/scripts/git-worktree.py
        - --repository
        - ${execution.project}
        - --workspace
        - ${variables.worktree}
        - --base
        - HEAD
  after:
    - name: release-worktree
      command: python3
      arguments:
        - ../registry/scripts/git-worktree.py
        - --repository
        - ${execution.project}
        - --workspace
        - ${variables.worktree}
        - --base
        - HEAD
        - --release
